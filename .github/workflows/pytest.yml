name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, v2.0]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[test]" coverage
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13'
        run: python -m pytest -q
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m coverage run --source=pystra -m pytest -q
          python -m coverage xml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          name: coverage
          path: coverage.xml

  quality:
    name: Naming, formatting, tutorials, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          python -m pip install -e ".[test,docs]" black==26.5.1 build twine
      - name: Check naming and formatting
        run: |
          python scripts/api_inventory.py --check-names --check-migration
          python -m black --check --target-version py39 src tests examples scripts docs/source/conf.py
      - name: Execute maintained tutorials
        run: python scripts/execute_notebooks.py --output-dir docs/source/notebooks
      - name: Build documentation
        working-directory: docs
        run: python -m sphinx -b html -W --keep-going -D nbsphinx_execute=never source build/html
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: development-artifacts
          path: |
            dist/*
            docs/build/html
