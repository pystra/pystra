name: Tests

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [main, v2.0]

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[test]" coverage
      - name: Verify core import without optional dependencies
        run: python -c "import pystra; from pystra.active_learning import PCESurrogate"
      - name: Install optional reliability dependencies
        run: python -m pip install -e ".[al]"
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13'
        run: python -m pytest -q
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m coverage run --source=pystra -m pytest -q
          python -m coverage xml
          python -m coverage report --fail-under=85
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          name: coverage
          path: coverage.xml

  minimum-dependencies:
    name: Minimum dependencies on Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the oldest supported dependencies
        # Wheels only: a missing wheel should fail here, not build from source
        run: >-
          python -m pip install -e ".[test,al]" -c ci/minimum-requirements.txt
          --only-binary numpy,scipy,pandas,matplotlib,scikit-learn
      - name: Record versions
        run: python -m pip list
      - name: Test
        run: python -m pytest -q

  quality:
    name: Naming, formatting, tutorials, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          python -m pip install -e ".[test,docs,al]" black==26.5.1 build twine
      - name: Check naming and formatting
        run: |
          python scripts/api_inventory.py --check-names --check-migration
          python -m black --check src tests examples scripts docs/source/conf.py docs/source/_ext docs/source/notebooks/literature_benchmarks.py
      - name: Execute maintained tutorials
        run: python scripts/execute_notebooks.py --output-dir docs/source/notebooks
      - name: Build documentation
        working-directory: docs
        run: python -m sphinx -b html -W --keep-going -D nbsphinx_execute=never source build/html
      - name: Check documentation links and downloads
        run: python scripts/check_docs.py docs/build/html
      - name: Check guide examples
        working-directory: docs
        run: python -m sphinx -b doctest -W --keep-going -D nbsphinx_execute=never source build/doctest
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: development-artifacts
          path: |
            dist/*
            docs/build/html
