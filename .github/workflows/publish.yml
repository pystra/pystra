name: Publish to PyPI

# Publishes only when a GitHub release is published. The full test workflow
# runs first on the release commit, and the tag must match the package version.
# PyPI accepts the upload through trusted publishing: configure the "pypi"
# environment on GitHub and this workflow as a trusted publisher on PyPI.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/pytest.yml

  dist:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/pystra/__init__.py').read_text()).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Build wheel and sdist
        run: pipx run build
      - name: Check metadata
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pystra
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
