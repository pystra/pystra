[build-system]
requires = ["setuptools >= 64.0",
            "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "Pystra"
dynamic = ["version"]
description = "Python Structural Reliability Analysis"
license = {text = "GPL-3.0-or-later"}
keywords = ["structural", "reliability", "engineering"]
authors = [{name = "Colin Caprani", email = "colin.caprani@monash.edu"},
           {name = "M. Shihab Khan", email = "shihab.khan@monash.edu"},
           {name = "Jürgen Hackl", email = "hackl.science@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11.2",
    "pandas>=2.1.1",
]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://pystra.github.io/pystra/"
Documentation = "https://pystra.github.io/pystra/"
Source = "https://github.com/pystra/pystra/"
Tracker = "https://github.com/pystra/pystra/issues/"

[project.optional-dependencies]
test = ["pytest >= 6.2.2"]
al = [
    "scikit-learn>=1.3.1",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-autodoc-typehints",
    "nbsphinx",
    "myst-parser",
    "sphinx-copybutton",
    "ipykernel",
    "openseespy",
]

[tool.setuptools]
platforms = ["any"]
include-package-data = true
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]

# [tool.setuptools.packages]
# find = {namespaces = false}

[tool.setuptools.dynamic]
version = {attr = "pystra.__version__"}

[tool.aliases]
test = "pytest"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests"
]
# Deprecations raised in PySTRA's own modules fail the tests, so that a
# dependency's announced change is fixed before it breaks a release.
filterwarnings = [
    "error::DeprecationWarning:pystra",
    "error::PendingDeprecationWarning:pystra",
    "error::FutureWarning:pystra",
]

[tool.black]
target-version = ["py312", "py313"]
